<!--
  Supabase → Authentication → Emails → Magic Link
  Subject: Your Lampstand sign-in link
  The link uses token_hash so it works on a different device from the one that asked for it.
-->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#0f111a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f111a;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#171a26;border-radius:16px;padding:32px 28px;font-family:Georgia,'Times New Roman',serif;color:#f1ebdd;">
            <tr>
              <td style="font-size:22px;letter-spacing:0.02em;padding-bottom:20px;">
                Lamp<span style="color:#e4c04a;">stand</span>
              </td>
            </tr>
            <tr>
              <td style="font-size:26px;line-height:1.3;padding-bottom:12px;">Your sign-in link</td>
            </tr>
            <tr>
              <td style="font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#cfc8b8;padding-bottom:24px;">
                Tap the button to sign in to Lampstand. It works once, for a short time, on any device.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
                   style="display:inline-block;background:#e4c04a;color:#1b1505;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-weight:bold;font-size:16px;padding:14px 26px;border-radius:999px;">
                  Sign in to Lampstand
                </a>
              </td>
            </tr>
            <tr>
              <td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#8f887a;">
                If you didn't ask to sign in, you can ignore this email; nothing changes without the link.<br /><br />
                Lampstand · lampstandbible.com
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
